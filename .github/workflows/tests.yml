name: tests
on: [push, pull_request]
permissions: { contents: read }   # минимальный токен CI, в том числе для PR из чужих форков
jobs:
  run_all:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 27.10: run на 93d09b0 висел на apt-get больше 30 мин — без предела GitHub ждёт до 6 ч
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
      - run: for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && exit 0; sudo dpkg --configure -a || true; sleep 10; done; exit 1   # зеркало apt зависло — повтор, не 6 ч; оборванный dpkg — довести перед повтором
        timeout-minutes: 16   # худший случай 3×(150+150)+2×10 = 920 с < 960
      - run: pip install pyyaml pillow numpy telethon==1.45.0   # telethon — test_folders (owner-telegram): без него «итог 0/0» = провал в CI
      - run: HOME=$(mktemp -d) bash tests/run_all.sh   # every test_* in the repo + frontmatter, sandboxed HOME
      - name: privacy-lint — наши значения не в ядре (список — секрет PRIVACY_JSON, в дереве его нет; без секрета шаг пропускается)
        env: { PRIVACY_LIST: "${{ secrets.PRIVACY_JSON }}" }
        run: |
          if [ -z "$PRIVACY_LIST" ]; then echo "нет секрета PRIVACY_JSON (форк/PR) — пропуск"; exit 0; fi
          umask 077; printf '%s' "$PRIVACY_LIST" > "$RUNNER_TEMP/privacy.json"
          PRIVACY_JSON="$RUNNER_TEMP/privacy.json" python3 tools/privacy_lint.py --all
