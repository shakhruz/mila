name: tests
on: [push, pull_request]
permissions: { contents: read }   # минимальный токен CI, в том числе для PR из чужих форков
jobs:
  run_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pyyaml pillow numpy
      - run: HOME=$(mktemp -d) bash tests/run_all.sh   # every test_* in the repo + frontmatter, sandboxed HOME
